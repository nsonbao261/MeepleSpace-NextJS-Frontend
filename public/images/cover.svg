<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <!--
    Single placeholder cover for the whole catalog, served as a plain <img
    src>, so every colour is baked in: a standalone SVG cannot read the CSS
    custom properties in globals.css. The values are the real design tokens, so
    the artwork still matches the palette.

    600x800 is 3:4 and is the same intrinsic size the card's cover box and
    cover-fan.tsx both assume. Deliberately textless: with one image shared
    across 60 games a baked-in title would be wrong on 59 of them, and the card
    already renders the real product name below the image.
  -->
  <rect width="600" height="800" fill="oklch(0.945 0.008 -33)" />

  <!-- Meeple silhouette, same construction as the deleted per-game generator:
       mirrored halves traversed apex -> right -> crotch -> left -> apex, so it
       is symmetric by construction rather than by eye. The path is symmetric
       about x = 0, so centring is a matter of translating to the canvas centre,
       not to (WIDTH - width) / 2. -->
  <g transform="translate(300 301)" fill="oklch(0.575 0.125 -33)" opacity="0.16">
    <path d="M0,0L46.8,7.2L93.6,36L104.4,72L79.2,82.8L54,75.6L61.2,111.6L82.8,187.2L25.2,198L0,108Z" />
  </g>

  <!-- Inner keyline, so the placeholder reads as a framed cover rather than a
       flat swatch. -->
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="oklch(0.795 0.085 -33)" stroke-width="2" opacity="0.5" />

  <!-- Bottom rule standing in for a publisher/imprint line, without pretending
       to be one. -->
  <g fill="oklch(0.685 0.11 -33)" opacity="0.55">
    <rect x="228" y="690" width="144" height="10" rx="5" />
  </g>
</svg>

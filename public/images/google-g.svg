<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18" height="18">
  <!--
    Google's "G" as an asset, never the word "Google" set in a font: Google brand
    guidelines forbid rendering the wordmark as text, and this is the one place
    in the codebase where that rule is enforceable (spec §5.5).

    The four brand colours live here and nowhere else. A component is not allowed
    to carry them, and Step 11's token audit only passes because they are baked
    into a file under public/ (§7.2). For the same reason this is served as a
    plain <img src>: like public/images/cover.svg, a standalone SVG cannot read
    the CSS custom properties in globals.css.

    Geometry: a 48-unit ring centred on (24, 24) — outer radius 20, inner radius
    12 — with the bar running from the centre to the right edge between y=20 and
    y=28. The whole shape is filled yellow first, then the three bands are
    painted over it: red across the top, green around the bottom, blue down the
    right side and out through the bar. Yellow is what shows through on the
    left, which is why it is the base shape rather than a fourth band.
  -->
